<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard — Citywide Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../style.css" />
</head>
<body data-cw-guard="admin">
  <nav class="navbar navbar-expand-lg cw-navbar sticky-top">
    <div class="container">
      <a class="navbar-brand cw-brand" href="index.html"><img src="../logo-header.svg" alt="Admin" class="cw-logo-header" /> <span class="badge bg-danger ms-2">ADMIN</span></a>
      <div class="ms-auto"><a href="../logout.html" class="btn btn-sm btn-outline-secondary"><i class="bi bi-box-arrow-right"></i> Sign out</a></div>
    </div>
  </nav>
  <div class="container-fluid"><div class="row">
    <aside class="col-lg-3 col-xl-2 cw-sidebar" data-cw-admin-sidebar data-active="overview"></aside>
    <main class="col-lg-9 col-xl-10 py-4 px-4">
      <div class="mb-4"><h2 class="mb-1">Platform overview</h2><p class="text-muted mb-0"></p></div>
      <div class="row g-3 mb-4">
        <div class="col-sm-6 col-xl-3"><div class="cw-card cw-premium p-3"><span class="text-muted small">Total users</span><h3 class="mb-0 mt-2" data-ad="users-count">—</h3></div></div>
        <div class="col-sm-6 col-xl-3"><div class="cw-card cw-premium p-3"><span class="text-muted small">Active listings</span><h3 class="mb-0 mt-2" data-ad="active-listings">—</h3></div></div>
        <div class="col-sm-6 col-xl-3"><div class="cw-card cw-premium p-3"><span class="text-muted small">Pending approval</span><h3 class="mb-0 mt-2" data-ad="pending">—</h3></div></div>
        <div class="col-sm-6 col-xl-3"><div class="cw-card cw-premium p-3"><span class="text-muted small">Unread messages</span><h3 class="mb-0 mt-2" data-ad="unread-msgs">—</h3></div></div>
      </div>
      <div class="row g-4">
        <div class="col-lg-6"><div class="cw-card cw-premium p-4"><div class="d-flex justify-content-between align-items-center mb-3"><h5 class="mb-0">Pending listings</h5><a href="listings.html" class="btn btn-sm btn-brand"><i class="bi bi-eye me-1"></i>Review all</a></div><div data-ad="pending-list" class="small text-muted">Loading…</div></div></div>
        <div class="col-lg-6"><div class="cw-card cw-premium p-4"><h5 class="mb-3">Recent contact messages</h5><ul class="list-unstyled small mb-0" data-ad="msg-feed"><li class="text-muted">Loading…</li></ul></div></div>
      </div>
      <script>
      // Loads dashboard counters and lists in parallel for fast first paint
      (function(){
        function load(){
          Promise.all([cwData("users.json"),cwData("listings.json"),cwData("bookings.json"),cwData("messages.json")]).then(function(r){
            var users=r[0], listings=r[1], bookings=r[2], msgs=r[3];
            var extra=JSON.parse(localStorage.getItem("cw_users_extra")||"[]");
            var all=users.concat(extra);
            document.querySelector("[data-ad=users-count]").textContent = all.length.toLocaleString();
            document.querySelector("[data-ad=active-listings]").textContent = listings.filter(function(l){return l.status==="active";}).length.toLocaleString();
            var pending = listings.filter(function(l){return l.status==="pending";});
            document.querySelector("[data-ad=pending]").textContent = pending.length;
            document.querySelector("[data-ad=unread-msgs]").textContent = msgs.filter(function(m){return !m.read;}).length;

            document.querySelector("[data-ad=pending-list]").innerHTML = pending.length
              ? pending.slice(0,6).map(function(l){
                  return '<div class="d-flex justify-content-between border-bottom py-2"><span>'+l.title+' <span class="text-muted small">· '+l.category+'</span></span><span class="badge bg-warning text-dark">pending</span></div>';
                }).join("")
              : '<div class="text-muted">No pending listings 🎉</div>';

            document.querySelector("[data-ad=msg-feed]").innerHTML = msgs.slice().reverse().slice(0,6).map(function(m){
              return '<li class="mb-2"><i class="bi bi-dot text-brand"></i><strong>'+m.from+'</strong> — '+m.subject+' <span class="text-muted">· '+m.date+'</span></li>';
            }).join("") || '<li class="text-muted">No messages.</li>';
          });
        }
        document.addEventListener("DOMContentLoaded", load);
      })();
      </script>
    </main>
  </div></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../app.js"></script>
</body></html>
