<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Site Settings — Citywide Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../style.css" />
</head>
<body data-cw-guard="admin">
  <nav class="navbar navbar-expand-lg cw-navbar sticky-top">
    <div class="container">
      <a class="navbar-brand cw-brand" href="index.html"><img src="../logo-header.svg" alt="Admin" class="cw-logo-header" /> <span class="badge bg-danger ms-2">ADMIN</span></a>
      <div class="ms-auto"><a href="login.html" class="btn btn-sm btn-outline-secondary"><i class="bi bi-box-arrow-right"></i> Sign out</a></div>
    </div>
  </nav>
  <div class="container-fluid"><div class="row">
    <aside class="col-lg-3 col-xl-2 cw-sidebar" data-cw-admin-sidebar data-active="settings"></aside>
    <main class="col-lg-9 col-xl-10 py-4 px-4">
      <div class="mb-4"><h2 class="mb-1">Site settings</h2><p class="text-muted mb-0"></p></div>
      <div class="cw-card p-4" style="max-width:640px;">
       <div class="mb-3"><label class="form-label fw-semibold">Site name</label><input class="form-control" value="Citywide Jigjiga"/></div>
       <div class="mb-3"><label class="form-label fw-semibold">Support email</label><input class="form-control" value="hello@citywide-jigjiga.et"/></div>
       <div class="mb-3"><label class="form-label fw-semibold">Service fee (%)</label><input type="number" class="form-control" value="8"/></div>
       <div class="form-check mb-3"><input class="form-check-input" type="checkbox" id="reg" checked/><label class="form-check-label" for="reg">Allow new user registration</label></div>
       <button class="btn btn-brand">Save settings</button>
     </div>
    </main>
  </div></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../app.js"></script>
</body></html>
