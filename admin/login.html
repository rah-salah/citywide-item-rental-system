<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Admin Sign In — Citywide</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="../style.css"/>
</head><body>
<section class="py-5"><div class="container" style="max-width:440px;">
  <div class="text-center mb-4">
    <img src="../logo-header.svg" alt="" class="cw-logo-header mb-2"/>
    <h3>Admin sign in</h3>
    <p class="text-muted small">Restricted area. Authorized staff only.</p>
  </div>
  <div class="cw-card p-4">
    <form id="adminLoginForm">
      <div class="mb-3"><label class="form-label fw-semibold">Admin email</label><input type="email" id="adminEmail" class="form-control" placeholder="admin@citywide-jigjiga.et" required/></div>
      <div class="mb-3"><label class="form-label fw-semibold">Password</label><input type="password" id="adminPwd" class="form-control" placeholder="••••••••" required/></div>
      <div class="alert alert-danger d-none small" id="adminErr">Invalid admin credentials.</div>
      <div class="d-grid"><button class="btn btn-brand btn-lg" type="submit">Sign in to admin</button></div>
      <p class="text-center small text-muted mt-3 mb-0">Demo: <code>admin@citywide-jigjiga.et</code> / <code>admin123</code></p>
    </form>
  </div>
  <p class="text-center small mt-3"><a href="../home.html" class="text-muted">← Back to site</a></p>
</div></section>
<script>
document.getElementById('adminLoginForm').addEventListener('submit', function(e){
  e.preventDefault();
  var em = document.getElementById('adminEmail').value.trim().toLowerCase();
  var pw = document.getElementById('adminPwd').value;
  if (em === 'admin@citywide-jigjiga.et' && pw === 'admin123') {
    localStorage.setItem('cw_user', JSON.stringify({name:'Site Admin', email:em, role:'admin', area:'HQ'}));
    location.href = 'index.html';
  } else {
    document.getElementById('adminErr').classList.remove('d-none');
  }
});
</script>
</body></html>
