<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Analytics — Citywide Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../css/style.css" />
  <link rel="stylesheet" href="../../css/premium.css" />
</head>
<body data-cw-guard="admin" data-analytics-role="admin">
  <nav class="navbar navbar-expand-lg cw-navbar sticky-top">
    <div class="container-fluid">
      <a class="navbar-brand cw-brand" href="index.html"><img src="../logo-header.svg" alt="Admin" class="cw-logo-header" /> <span class="badge bg-danger ms-2">ADMIN</span></a>
      <div class="ms-auto d-flex align-items-center gap-2">
        <button class="btn btn-sm btn-outline-secondary" data-theme-toggle><i data-theme-icon class="bi bi-moon-stars-fill"></i></button>
        <a href="../logout.html" class="btn btn-sm btn-outline-secondary"><i class="bi bi-box-arrow-right"></i> Sign out</a>
      </div>
    </div>
  </nav>
  <div class="container-fluid"><div class="row">
    <aside class="col-lg-3 col-xl-2 cw-sidebar" data-cw-admin-sidebar data-active="analytics"></aside>
    <main class="col-lg-9 col-xl-10 py-4 px-4 px-xl-5" id="cwAnalyticsRoot">

      <div class="d-flex flex-wrap align-items-center justify-content-between mb-4 gap-3">
        <div>
          <p class="section-eyebrow mb-1">Reports · Operations</p>
          <h2 class="mb-1">Admin analytics</h2>
          <p class="text-muted mb-0">Live booking and listing activity for the selected range.</p>
        </div>
      </div>

      <div class="cw-filter-bar cw-card p-3 mb-4">
        <div class="d-flex flex-wrap align-items-center gap-2">
          <div class="cw-preset-group btn-group btn-group-sm flex-wrap">
            <button class="btn btn-outline-primary" data-preset="today">Today</button>
            <button class="btn btn-outline-primary" data-preset="7">Last 7 days</button>
            <button class="btn btn-outline-primary is-active" data-preset="30">Last 30 days</button>
            <button class="btn btn-outline-primary" data-preset="90">Last 90 days</button>
            <button class="btn btn-outline-primary" data-preset="year">Last year</button>
            <button class="btn btn-outline-primary" data-preset="all">Custom range</button>
          </div>
          <div class="vr d-none d-md-block mx-2"></div>
          <div class="d-flex align-items-center gap-2">
            <label class="form-label small mb-0">From</label>
            <input id="flFrom" type="date" class="form-control form-control-sm" style="width:150px" />
            <label class="form-label small mb-0">To</label>
            <input id="flTo" type="date" class="form-control form-control-sm" style="width:150px" />
            <button id="flReset" class="btn btn-sm btn-outline-secondary"><i class="bi bi-arrow-counterclockwise"></i></button>
          </div>
        </div>
      </div>

      <div class="row g-3 mb-4" id="cwKpiGrid"></div>

      <div class="row g-4">
        <div class="col-12">
          <div class="cw-chart-card cw-card p-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <div>
                <h5 class="mb-1"><i class="bi bi-calendar2-check text-primary me-2"></i>Booking Activity</h5>
                <p class="text-muted small mb-0">New bookings over the selected period</p>
              </div>
              <span class="badge bg-light text-muted">Live</span>
            </div>
            <div style="height:360px"><canvas id="chartBookings"></canvas></div>
          </div>
        </div>
        <div class="col-12">
          <div class="cw-chart-card cw-card p-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <div>
                <h5 class="mb-1"><i class="bi bi-plus-square text-warning me-2"></i>Listing Activity</h5>
                <p class="text-muted small mb-0">Listings created — by status</p>
              </div>
              <span class="badge bg-light text-muted">Active · Pending · Rejected · Inactive</span>
            </div>
            <div style="height:360px"><canvas id="chartListings"></canvas></div>
          </div>
        </div>
      </div>

    </main>
  </div></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="../../js/app.js"></script>
  <script src="../../js/analytics.js"></script>
  <script src="../../js/config.js"></script>
  <script src="../../js/chatbot.js" defer></script>
<script src="../../js/ui-enhancements.js" defer></script>
</body>
</html>
