<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Admins — Citywide Super Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../css/style.css" />
  <link rel="stylesheet" href="../../css/premium.css" />
</head>
<body data-cw-guard="superadmin">
  <nav class="navbar navbar-expand-lg cw-navbar sticky-top">
    <div class="container">
      <a class="navbar-brand cw-brand" href="index.html"><img src="../logo-header.svg" alt="Super Admin" class="cw-logo-header" /> <span class="badge bg-dark ms-2">SUPER ADMIN</span></a>
      <div class="ms-auto"><a href="../logout.html" class="btn btn-sm btn-outline-secondary"><i class="bi bi-box-arrow-right"></i> Sign out</a></div>
    </div>
  </nav>
  <div class="container-fluid"><div class="row">
    <aside class="col-lg-3 col-xl-2 cw-sidebar" data-cw-super-sidebar data-active="admins"></aside>
    <main class="col-lg-9 col-xl-10 py-4 px-4">
      <div class="mb-4"><h2 class="mb-1">Manage Admins</h2><p class="text-muted mb-0">Super admin · highest privileges.</p></div>
      
<div class="cw-card p-4 mb-4"><h5 class="mb-3">Create new admin</h5>
<form id="newAdminForm" class="row g-3">
  <div class="col-md-4"><input class="form-control" name="name" placeholder="Full name" required></div>
  <div class="col-md-4"><input type="email" class="form-control" name="email" placeholder="Email" required></div>
  <div class="col-md-3"><input type="password" class="form-control" name="password" placeholder="Password" required></div>
  <div class="col-md-1 d-grid"><button class="btn btn-brand">Add</button></div>
</form></div>
<div class="cw-card p-4"><h5 class="mb-3">Existing admins</h5><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Name</th><th>Email</th><th>Status</th><th class="text-end">Actions</th></tr></thead><tbody data-sa="rows"></tbody></table></div></div>
<script>
(function(){
  function refresh(){
    cwData("users.json").then(function(list){
      var extra=JSON.parse(localStorage.getItem("cw_users_extra")||"[]");
      var status=JSON.parse(localStorage.getItem("cw_admin_status")||"{}");
      var admins=list.concat(extra).filter(function(u){return (u.role||[]).indexOf("admin")>=0;});
      document.querySelector("[data-sa=rows]").innerHTML=admins.map(function(a){
        var st=status[a.id]||a.status||"active";
        return "<tr><td>"+a.name+"</td><td>"+a.email+"</td><td><span class=\"badge bg-"+(st==="suspended"?"secondary":"success")+"\">"+st+"</span></td><td class=\"text-end\"><button class=\"btn btn-sm btn-outline-secondary\" data-toggle=\""+a.id+"\">"+(st==="suspended"?"Reactivate":"Suspend")+"</button></td></tr>";
      }).join("");
      document.querySelectorAll("[data-toggle]").forEach(function(b){
        b.addEventListener("click",function(){
          var id=b.getAttribute("data-toggle"); var s=JSON.parse(localStorage.getItem("cw_admin_status")||"{}");
          s[id]=(s[id]==="suspended"?"active":"suspended"); localStorage.setItem("cw_admin_status",JSON.stringify(s)); refresh();
        });
      });
    });
  }
  document.getElementById("newAdminForm").addEventListener("submit",function(e){
    e.preventDefault(); var fd=new FormData(e.target);
    var extra=JSON.parse(localStorage.getItem("cw_users_extra")||"[]");
    extra.push({id:Date.now(),name:fd.get("name"),email:fd.get("email"),password:fd.get("password"),role:["admin"],avatar:null,status:"active"});
    localStorage.setItem("cw_users_extra",JSON.stringify(extra));
    e.target.reset(); refresh();
  });
  document.addEventListener("DOMContentLoaded",refresh);
})();
</script>
    </main>
  </div></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../js/app.js"></script>
  <script src="../../js/config.js"></script>
<script src="../../js/chatbot.js" defer></script>
<script src="../../js/mobile-nav.js" defer></script>
<script src="../../js/ui-enhancements.js" defer></script>
</body></html>
