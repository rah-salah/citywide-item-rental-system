<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile - Citywide Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../css/main.css" />
  <link rel="stylesheet" href="../../css/dashboard.css" />
</head>
<body data-cw-guard="admin">
  <nav class="navbar navbar-expand-lg cw-navbar sticky-top">
    <div class="container">
      <a class="navbar-brand cw-brand" href="index.html"><img src="../../assets/logos/logo-header.svg" alt="Admin" class="cw-logo-header" /> <span class="badge bg-danger ms-2">ADMIN</span></a>
      <div class="ms-auto"><a href="../logout.html" class="btn btn-sm btn-outline-secondary"><i class="bi bi-box-arrow-right"></i> Sign out</a></div>
    </div>
  </nav>
  <div class="container-fluid"><div class="row">
    <aside class="col-lg-3 col-xl-2 cw-sidebar" data-cw-admin-sidebar data-active="profile"></aside>
    <main class="col-lg-9 col-xl-10 py-4 px-4">
      <div class="mb-4"><h2 class="mb-1">Profile</h2><p class="text-muted mb-0">Update your admin account information.</p></div>
      <div class="row g-4">
        <div class="col-lg-4"><div class="cw-card p-4 text-center">
          <img data-cw-avatar-preview alt="Avatar preview" class="rounded-circle mb-3" style="width:96px;height:96px;object-fit:cover;display:none;" />
          <div class="cw-avatar cw-avatar-lg mx-auto mb-3" data-user-initial>U</div>
          <h5 class="mb-1" data-user-name>User</h5>
          <p class="text-muted small mb-3"><i class="bi bi-shield-check"></i> Admin</p>
          <input type="file" data-cw-avatar accept="image/*" class="form-control form-control-sm" />
        </div></div>
        <div class="col-lg-8"><div class="cw-card p-4">
          <h5 class="mb-3">Personal details</h5>
          <form data-cw-profile>
            <div class="row g-3">
              <div class="col-md-6"><label class="form-label fw-semibold">Full name</label><input name="fullName" class="form-control" /></div>
              <div class="col-md-6"><label class="form-label fw-semibold">Email address</label><input name="email" type="email" class="form-control" /></div>
              <div class="col-md-6"><label class="form-label fw-semibold">Phone number</label><input name="phone" type="tel" class="form-control" /></div>
              <div class="col-md-6"><label class="form-label fw-semibold">Neighbourhood</label><input name="area" class="form-control" /></div>
              <div class="col-12"><label class="form-label fw-semibold">Address</label><input name="address" class="form-control" /></div>
              <div class="col-12"><label class="form-label fw-semibold">About you</label><textarea name="bio" class="form-control" rows="3"></textarea></div>
              <div class="col-12 text-end"><button class="btn btn-brand" type="submit">Save changes</button></div>
            </div>
          </form>
        </div></div>
      </div>
    </main>
  </div></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../js/main.js"></script>
  <script src="../../js/config.js"></script>
  <script src="../../js/chatbot.js" defer></script>
  <script src="../../js/sidebar.js" defer></script>
  <script src="../../js/reviews.js" defer></script>
  <script src="../../js/rental-requests.js" defer></script>
  <script src="../../js/dashboard.js" defer></script>
</body>
</html>
