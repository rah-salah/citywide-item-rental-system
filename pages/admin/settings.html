<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Site Settings — Citywide Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../css/main.css" />
  <link rel="stylesheet" href="../../css/dashboard.css" />
</head>
<body data-cw-guard="admin">
  <div class="container-fluid"><div class="row">
    <aside class="col-lg-3 col-xl-2 cw-sidebar" data-cw-admin-sidebar data-active="settings"></aside>
    <main class="col-lg-9 col-xl-10 py-4 px-4">
      <div class="mb-4"><h2 class="mb-1">Site settings</h2><p class="text-muted mb-0"></p></div>
      <div class="cw-card p-4" style="max-width:640px;">
       <div class="mb-3"><label class="form-label fw-semibold">Site name</label><input class="form-control" value="Citywide Jigjiga"/></div>
       <div class="mb-3"><label class="form-label fw-semibold">Support email</label><input class="form-control" value="hello@citywide-jigjiga.et"/></div>
       <div class="mb-3"><label class="form-label fw-semibold">Service fee (%)</label><input type="number" class="form-control" value="8"/></div>
       <div class="form-check mb-3"><input class="form-check-input" type="checkbox" id="reg" checked/><label class="form-check-label" for="reg">Allow new user registration</label></div>
       <button class="btn btn-brand">Save settings</button>
     </div>
    </main>
  </div></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../js/main.js"></script>
  <script src="../../js/config.js"></script>
<script src="../../js/chatbot.js" defer></script>
<script src="../../js/sidebar.js" defer></script>
<script src="../../js/reviews.js" defer></script>
  <script src="../../js/rental-requests.js" defer></script>
<script src="../../js/dashboard.js" defer></script>

<script src="../../js/cw-fixes.js" defer></script>
</body></html>
