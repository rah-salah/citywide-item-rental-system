<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Categories — Citywide Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../css/main.css" />
  <link rel="stylesheet" href="../../css/dashboard.css" />
</head>
<body data-cw-guard="admin">
  <div class="container-fluid"><div class="row">
    <aside class="col-lg-3 col-xl-2 cw-sidebar" data-cw-admin-sidebar data-active="categories"></aside>
    <main class="col-lg-9 col-xl-10 py-4 px-4">
      <div class="mb-4"><h2 class="mb-1">Categories</h2><p class="text-muted mb-0">Manage the categories used across listings.</p></div>
      <div class="cw-card p-3 mb-3">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h6 class="mb-0">All categories</h6>
          <button id="cwAddCat" class="btn btn-sm btn-brand"><i class="bi bi-plus"></i> Add category</button>
        </div>
        <ul id="cwCatList" class="list-group list-group-flush"><li class="list-group-item text-muted">Loading…</li></ul>
      </div>
    </main>
  </div></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../js/main.js"></script>
  <script>
  // Categories admin page: reads from data/categories.json and stores
  // user edits in localStorage so the JSON file stays the source of truth
  // for the initial seed.
  (function(){
    var KEY = "cw_categories_extra"; // local additions / overrides
    function load(){
      return cwData("categories.json").then(function(seed){
        var extra = []; try { extra = JSON.parse(localStorage.getItem(KEY)||"[]"); } catch(e){}
        return seed.concat(extra);
      });
    }
    function save(extra){ localStorage.setItem(KEY, JSON.stringify(extra)); }
    function render(){
      load().then(function(cats){
        var host = document.getElementById("cwCatList");
        if (!cats.length){ host.innerHTML='<li class="list-group-item text-muted">No categories yet.</li>'; return; }
        host.innerHTML = cats.map(function(c){
          return '<li class="list-group-item d-flex justify-content-between align-items-center">'
               + '<span><i class="bi bi-'+(c.icon||"tag")+' me-2 text-muted"></i>'+c.name+'</span>'
               + '<span><a href="#" class="text-brand small me-2" data-edit="'+c.id+'">Edit</a>'
               + '<a href="#" class="text-danger small" data-del="'+c.id+'">Delete</a></span>'
               + '</li>';
        }).join("");
        host.querySelectorAll("[data-del]").forEach(function(a){
          a.addEventListener("click", function(e){
            e.preventDefault();
            var id = a.getAttribute("data-del");
            if (!confirm("Delete this category?")) return;
            var extra = JSON.parse(localStorage.getItem(KEY)||"[]");
            extra = extra.filter(function(x){ return String(x.id)!==String(id); });
            save(extra); render();
          });
        });
        host.querySelectorAll("[data-edit]").forEach(function(a){
          a.addEventListener("click", function(e){
            e.preventDefault();
            var id = a.getAttribute("data-edit");
            var name = prompt("New name for this category:");
            if (!name) return;
            var extra = JSON.parse(localStorage.getItem(KEY)||"[]");
            var found = extra.find(function(x){ return String(x.id)===String(id); });
            if (found) found.name = name.trim();
            else extra.push({ id:id, name:name.trim(), icon:"tag", overrideOf:id });
            save(extra); render();
          });
        });
      });
    }
    document.getElementById("cwAddCat").addEventListener("click", function(){
      var name = prompt("Category name:"); if (!name) return;
      var extra = JSON.parse(localStorage.getItem(KEY)||"[]");
      extra.push({ id:"cat-"+Date.now(), name:name.trim(), icon:"tag" });
      save(extra); render();
    });
    document.addEventListener("DOMContentLoaded", render);
  })();
  </script>
  <script src="../../js/config.js"></script>
<script src="../../js/chatbot.js" defer></script>
<script src="../../js/sidebar.js" defer></script>
<script src="../../js/reviews.js" defer></script>
  <script src="../../js/rental-requests.js" defer></script>
<script src="../../js/dashboard.js" defer></script>

<script src="../../js/cw-fixes.js" defer></script>
</body></html>
