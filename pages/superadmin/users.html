<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>All Users — Citywide Super Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../css/main.css" />
  <link rel="stylesheet" href="../../css/dashboard.css" />
</head>
<body data-cw-guard="superadmin">
  <div class="container-fluid"><div class="row">
    <aside class="col-lg-3 col-xl-2 cw-sidebar" data-cw-super-sidebar data-active="users"></aside>
    <main class="col-lg-9 col-xl-10 py-4 px-4">
      <div class="mb-4"><h2 class="mb-1">All Users</h2><p class="text-muted mb-0">Super admin · highest privileges.</p></div>
      
<div class="cw-card p-4"><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th></tr></thead><tbody data-sa="rows"></tbody></table></div></div>
<script>
document.addEventListener("DOMContentLoaded",function(){
  cwData("users.json").then(function(list){
    var extra=JSON.parse(localStorage.getItem("cw_users_extra")||"[]");
    var all=list.concat(extra);
    document.querySelector("[data-sa=rows]").innerHTML=all.map(function(u){
      return "<tr><td>"+u.name+"</td><td>"+u.email+"</td><td>"+(u.role||[]).join(", ")+"</td><td><span class=\"badge bg-success\">"+(u.status||"active")+"</span></td></tr>";
    }).join("");
  });
});
</script>
    </main>
  </div></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../js/main.js"></script>
  <script src="../../js/config.js"></script>
<script src="../../js/chatbot.js" defer></script>
<script src="../../js/sidebar.js" defer></script>
<script src="../../js/reviews.js" defer></script>
  <script src="../../js/rental-requests.js" defer></script>
<script src="../../js/dashboard.js" defer></script>

<script src="../../js/cw-fixes.js" defer></script>
</body></html>
