<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Site Settings — Citywide Super Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../css/main.css" />
  <link rel="stylesheet" href="../../css/dashboard.css" />
</head>
<body data-cw-guard="superadmin">
  <div class="container-fluid"><div class="row">
    <aside class="col-lg-3 col-xl-2 cw-sidebar" data-cw-super-sidebar data-active="settings"></aside>
    <main class="col-lg-9 col-xl-10 py-4 px-4">
      <div class="mb-4"><h2 class="mb-1">Site Settings</h2><p class="text-muted mb-0">Super admin · highest privileges.</p></div>
      
<div class="cw-card p-4"><form id="siteSettings" class="row g-3">
  <div class="col-md-6"><label class="form-label fw-semibold">City name</label><input class="form-control" name="cityName"></div>
  <div class="col-md-6"><label class="form-label fw-semibold">Contact email</label><input type="email" class="form-control" name="contactEmail"></div>
  <div class="col-md-6"><label class="form-label fw-semibold">Platform fee (%)</label><input type="number" class="form-control" name="platformFee"></div>
  <div class="col-md-6"><label class="form-label fw-semibold">Payment info</label><input class="form-control" name="paymentInfo"></div>
  <div class="col-12"><label class="form-label fw-semibold">Rental policy</label><textarea class="form-control" rows="4" name="rentalPolicy"></textarea></div>
  <div class="col-12 text-end"><button class="btn btn-brand">Save settings</button></div>
</form></div>
<script>
(function(){
  function load(){
    var local=localStorage.getItem("cw_settings");
    var p=local?Promise.resolve(JSON.parse(local)):cwData("settings.json");
    p.then(function(s){ Object.keys(s).forEach(function(k){var el=document.querySelector("[name="+k+"]"); if(el) el.value=s[k];}); });
  }
  document.getElementById("siteSettings").addEventListener("submit",function(e){
    e.preventDefault(); var fd=new FormData(e.target); var obj={};
    fd.forEach(function(v,k){obj[k]=v;});
    localStorage.setItem("cw_settings",JSON.stringify(obj)); alert("Settings saved.");
  });
  document.addEventListener("DOMContentLoaded",load);
})();
</script>
    </main>
  </div></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../js/main.js"></script>
  <script src="../../js/config.js"></script>
<script src="../../js/chatbot.js" defer></script>
<script src="../../js/sidebar.js" defer></script>
<script src="../../js/reviews.js" defer></script>
  <script src="../../js/rental-requests.js" defer></script>
<script src="../../js/dashboard.js" defer></script>

<script src="../../js/cw-fixes.js" defer></script>
</body></html>
