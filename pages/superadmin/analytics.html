<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Analytics — Citywide Super Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../css/main.css" />
  <link rel="stylesheet" href="../../css/dashboard.css" />
</head>
<body data-cw-guard="superadmin" data-analytics-role="superadmin">
  <div class="container-fluid"><div class="row">
    <aside class="col-lg-3 col-xl-2 cw-sidebar" data-cw-super-sidebar data-active="analytics"></aside>
    <main class="col-lg-9 col-xl-10 py-4 px-4 px-xl-5" id="cwAnalyticsRoot">

      <div class="d-flex flex-wrap align-items-center justify-content-between mb-4 gap-3">
        <div>
          <p class="section-eyebrow mb-1">Enterprise · Platform Intelligence</p>
          <h2 class="mb-1">Platform analytics</h2>
          <p class="text-muted mb-0">Revenue trend and platform growth across the entire CityWide marketplace.</p>
        </div>
        <div class="text-muted small">
          <i class="bi bi-calendar3 me-1"></i> Range: <span id="cwRangeLabel">—</span>
        </div>
      </div>

      <div class="cw-filter-bar cw-card p-3 mb-4">
        <div class="d-flex flex-wrap align-items-center gap-2">
          <div class="cw-preset-group btn-group btn-group-sm flex-wrap">
            <button class="btn btn-outline-primary" data-preset="today">Today</button>
            <button class="btn btn-outline-primary" data-preset="7">Last 7 days</button>
            <button class="btn btn-outline-primary is-active" data-preset="30">Last 30 days</button>
            <button class="btn btn-outline-primary" data-preset="90">Last 90 days</button>
            <button class="btn btn-outline-primary" data-preset="year">Last year</button>
            <button class="btn btn-outline-primary" data-preset="all">Custom range</button>
          </div>
          <div class="vr d-none d-md-block mx-2"></div>
          <div class="d-flex align-items-center gap-2">
            <label class="form-label small mb-0">From</label>
            <input id="flFrom" type="date" class="form-control form-control-sm" style="width:150px" />
            <label class="form-label small mb-0">To</label>
            <input id="flTo" type="date" class="form-control form-control-sm" style="width:150px" />
            <button id="flReset" class="btn btn-sm btn-outline-secondary"><i class="bi bi-arrow-counterclockwise"></i></button>
          </div>
        </div>
      </div>

      <div class="row g-3 mb-4" id="cwKpiGrid"></div>

      <div class="row g-4">
        <div class="col-12">
          <div class="cw-chart-card cw-card p-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <div>
                <h5 class="mb-1"><i class="bi bi-cash-stack text-success me-2"></i>Revenue Trend</h5>
                <p class="text-muted small mb-0">Total revenue across bookings &amp; ads</p>
              </div>
              <span class="badge bg-light text-muted">Total · Bookings · Ads</span>
            </div>
            <div style="height:360px"><canvas id="chartRevenue"></canvas></div>
          </div>
        </div>
        <div class="col-12">
          <div class="cw-chart-card cw-card p-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <div>
                <h5 class="mb-1"><i class="bi bi-graph-up-arrow text-info me-2"></i>Platform Growth</h5>
                <p class="text-muted small mb-0">Users, listings &amp; bookings combined</p>
              </div>
              <span class="badge bg-light text-muted">Users · Listings · Bookings</span>
            </div>
            <div style="height:360px"><canvas id="chartPlatform"></canvas></div>
          </div>
        </div>
      </div>

    </main>
  </div></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="../../js/main.js"></script>
  <script src="../../js/charts.js"></script>
  <script src="../../js/config.js"></script>
  <script src="../../js/chatbot.js" defer></script>
  <script src="../../js/reviews.js" defer></script>
  <script src="../../js/rental-requests.js" defer></script>
<script src="../../js/dashboard.js" defer></script>
<script src="../../js/sidebar.js" defer></script>

<script src="../../js/cw-fixes.js" defer></script>
</body>
</html>
