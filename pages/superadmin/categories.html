<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Categories — Citywide Super Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../css/main.css" />
  <link rel="stylesheet" href="../../css/dashboard.css" />
</head>
<body data-cw-guard="superadmin">
  <div class="container-fluid"><div class="row">
    <aside class="col-lg-3 col-xl-2 cw-sidebar" data-cw-super-sidebar data-active="categories"></aside>
    <main class="col-lg-9 col-xl-10 py-4 px-4">
      <div class="mb-4"><h2 class="mb-1">Categories</h2><p class="text-muted mb-0">Super admin · highest privileges.</p></div>
      
<div class="cw-card p-4 mb-4"><h5 class="mb-3">Add category</h5>
<form id="newCat" class="row g-3">
  <div class="col-md-8"><input class="form-control" name="name" placeholder="Category name" required></div>
  <div class="col-md-3"><input class="form-control" name="icon" placeholder="Icon (e.g. truck)" required></div>
  <div class="col-md-1 d-grid"><button class="btn btn-brand">Add</button></div>
</form></div>
<div class="cw-card p-4"><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Icon</th><th>Name</th><th class="text-end">Actions</th></tr></thead><tbody data-sa="rows"></tbody></table></div></div>
<script>
(function(){
  function get(){ var local=localStorage.getItem("cw_categories"); if(local) return Promise.resolve(JSON.parse(local)); return cwData("categories.json"); }
  function save(list){ localStorage.setItem("cw_categories",JSON.stringify(list)); }
  function refresh(){ get().then(function(cats){
    document.querySelector("[data-sa=rows]").innerHTML=cats.map(function(c){
      return "<tr><td><i class=\"bi bi-"+c.icon+"\"></i></td><td>"+c.name+"</td><td class=\"text-end\"><button class=\"btn btn-sm btn-outline-danger\" data-del=\""+c.id+"\">Remove</button></td></tr>";
    }).join("");
    document.querySelectorAll("[data-del]").forEach(function(b){b.addEventListener("click",function(){
      var id=parseInt(b.getAttribute("data-del"),10);
      get().then(function(l){ save(l.filter(function(x){return x.id!==id;})); refresh(); });
    });});
  }); }
  document.getElementById("newCat").addEventListener("submit",function(e){
    e.preventDefault(); var fd=new FormData(e.target);
    get().then(function(l){ l.push({id:Date.now(),name:fd.get("name"),icon:fd.get("icon")}); save(l); e.target.reset(); refresh(); });
  });
  document.addEventListener("DOMContentLoaded",refresh);
})();
</script>
    </main>
  </div></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../js/main.js"></script>
  <script src="../../js/config.js"></script>
<script src="../../js/chatbot.js" defer></script>
<script src="../../js/sidebar.js" defer></script>
<script src="../../js/reviews.js" defer></script>
  <script src="../../js/rental-requests.js" defer></script>
<script src="../../js/dashboard.js" defer></script>

<script src="../../js/cw-fixes.js" defer></script>
</body></html>
