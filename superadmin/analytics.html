<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Analytics — Citywide Super Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../style.css" />
</head>
<body data-cw-guard="superadmin">
  <nav class="navbar navbar-expand-lg cw-navbar sticky-top">
    <div class="container">
      <a class="navbar-brand cw-brand" href="index.html"><img src="../logo-header.svg" alt="Super Admin" class="cw-logo-header" /> <span class="badge bg-dark ms-2">SUPER ADMIN</span></a>
      <div class="ms-auto"><a href="../logout.html" class="btn btn-sm btn-outline-secondary"><i class="bi bi-box-arrow-right"></i> Sign out</a></div>
    </div>
  </nav>
  <div class="container-fluid"><div class="row">
    <aside class="col-lg-3 col-xl-2 cw-sidebar" data-cw-super-sidebar data-active="analytics"></aside>
    <main class="col-lg-9 col-xl-10 py-4 px-4">
      <div class="mb-4"><h2 class="mb-1">Analytics</h2><p class="text-muted mb-0">Super admin · highest privileges.</p></div>
      
<div class="row g-3 mb-4">
  <div class="col-md-4"><div class="cw-card p-3"><span class="text-muted small">Total bookings</span><h3 class="mb-0 mt-2" data-sa="bk">—</h3></div></div>
  <div class="col-md-4"><div class="cw-card p-3"><span class="text-muted small">Total listings</span><h3 class="mb-0 mt-2" data-sa="li">—</h3></div></div>
  <div class="col-md-4"><div class="cw-card p-3"><span class="text-muted small">Avg booking value</span><h3 class="mb-0 mt-2" data-sa="avg">—</h3></div></div>
</div>
<div class="cw-card p-4"><h5 class="mb-3">Earnings by owner</h5><div class="table-responsive"><table class="table"><thead><tr><th>Owner</th><th>Total</th></tr></thead><tbody data-sa="own"></tbody></table></div></div>
<script>
document.addEventListener("DOMContentLoaded",function(){
  Promise.all([cwData("bookings.json"),cwData("listings.json"),cwData("earnings.json"),cwData("users.json")]).then(function(r){
    var b=r[0],l=r[1],e=r[2],u=r[3];
    document.querySelector("[data-sa=bk]").textContent=b.length;
    document.querySelector("[data-sa=li]").textContent=l.length;
    var avg=Math.round(b.reduce(function(a,x){return a+x.total;},0)/b.length);
    document.querySelector("[data-sa=avg]").textContent=avg.toLocaleString()+" ETB";
    var map={}; e.forEach(function(x){map[x.ownerId]=(map[x.ownerId]||0)+x.amount;});
    document.querySelector("[data-sa=own]").innerHTML=Object.keys(map).map(function(id){
      var name=(u.filter(function(x){return x.id==id;})[0]||{}).name||("#"+id);
      return "<tr><td>"+name+"</td><td>"+map[id].toLocaleString()+" ETB</td></tr>";
    }).join("");
  });
});
</script>
    </main>
  </div></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../app.js"></script>
</body></html>
