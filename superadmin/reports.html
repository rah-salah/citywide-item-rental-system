<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reports & Disputes — Citywide Super Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../style.css" />
</head>
<body data-cw-guard="superadmin">
  <nav class="navbar navbar-expand-lg cw-navbar sticky-top">
    <div class="container">
      <a class="navbar-brand cw-brand" href="index.html"><img src="../logo-header.svg" alt="Super Admin" class="cw-logo-header" /> <span class="badge bg-dark ms-2">SUPER ADMIN</span></a>
      <div class="ms-auto"><a href="../logout.html" class="btn btn-sm btn-outline-secondary"><i class="bi bi-box-arrow-right"></i> Sign out</a></div>
    </div>
  </nav>
  <div class="container-fluid"><div class="row">
    <aside class="col-lg-3 col-xl-2 cw-sidebar" data-cw-super-sidebar data-active="reports"></aside>
    <main class="col-lg-9 col-xl-10 py-4 px-4">
      <div class="mb-4"><h2 class="mb-1">Reports & Disputes</h2><p class="text-muted mb-0">Super admin · highest privileges.</p></div>
      
<div class="cw-card p-4"><div class="table-responsive"><table class="table align-middle"><thead><tr><th>#</th><th>Subject</th><th>Date</th><th>Status</th><th>Escalated</th></tr></thead><tbody data-sa="rows"></tbody></table></div></div>
<script>
document.addEventListener("DOMContentLoaded",function(){
  cwData("disputes.json").then(function(d){
    document.querySelector("[data-sa=rows]").innerHTML=d.map(function(x){
      return "<tr><td>"+x.id+"</td><td>"+x.subject+"</td><td>"+x.date+"</td><td><span class=\"badge bg-"+(x.status==="open"?"warning":"success")+"\">"+x.status+"</span></td><td>"+(x.escalated?"<span class=\"badge bg-danger\">Yes</span>":"No")+"</td></tr>";
    }).join("");
  });
});
</script>
    </main>
  </div></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../app.js"></script>
</body></html>
