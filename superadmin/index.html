<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Platform overview — Citywide Super Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../style.css" />
</head>
<body data-cw-guard="superadmin">
  <nav class="navbar navbar-expand-lg cw-navbar sticky-top">
    <div class="container">
      <a class="navbar-brand cw-brand" href="index.html"><img src="../logo-header.svg" alt="Super Admin" class="cw-logo-header" /> <span class="badge bg-dark ms-2">SUPER ADMIN</span></a>
      <div class="ms-auto"><a href="../logout.html" class="btn btn-sm btn-outline-secondary"><i class="bi bi-box-arrow-right"></i> Sign out</a></div>
    </div>
  </nav>
  <div class="container-fluid"><div class="row">
    <aside class="col-lg-3 col-xl-2 cw-sidebar" data-cw-super-sidebar data-active="overview"></aside>
    <main class="col-lg-9 col-xl-10 py-4 px-4">
      <div class="mb-4"><h2 class="mb-1">Platform overview</h2><p class="text-muted mb-0">Super admin · highest privileges.</p></div>
      
<div class="row g-3 mb-4">
  <div class="col-sm-6 col-xl-3"><div class="cw-card p-3"><span class="text-muted small">Total users</span><h3 class="mb-0 mt-2" data-sa="users-count">—</h3></div></div>
  <div class="col-sm-6 col-xl-3"><div class="cw-card p-3"><span class="text-muted small">Active rentals</span><h3 class="mb-0 mt-2" data-sa="active-rentals">—</h3></div></div>
  <div class="col-sm-6 col-xl-3"><div class="cw-card p-3"><span class="text-muted small">Monthly revenue</span><h3 class="mb-0 mt-2" data-sa="month-rev">—</h3></div></div>
  <div class="col-sm-6 col-xl-3"><div class="cw-card p-3"><span class="text-muted small">Open disputes</span><h3 class="mb-0 mt-2" data-sa="open-disputes">—</h3></div></div>
</div>
<div class="row g-4">
  <div class="col-lg-6"><div class="cw-card p-4"><div class="d-flex justify-content-between align-items-center mb-3"><h5 class="mb-0">Admin accounts</h5><a href="admins.html" class="btn btn-sm btn-brand"><i class="bi bi-person-plus me-1"></i>Add admin</a></div><div data-sa="admin-list" class="small text-muted">Loading…</div></div></div>
  <div class="col-lg-6"><div class="cw-card p-4"><h5 class="mb-3">Recent activity</h5><ul class="list-unstyled small mb-0" data-sa="activity-feed"><li class="text-muted">Loading…</li></ul></div></div>
</div>
<script>
(function(){
  function load(){
    Promise.all([cwData("users.json"),cwData("bookings.json"),cwData("transactions.json"),cwData("disputes.json"),cwData("audit_log.json")]).then(function(r){
      var users=r[0], bk=r[1], tx=r[2], dp=r[3], log=r[4];
      var extra=JSON.parse(localStorage.getItem("cw_users_extra")||"[]");
      var all=users.concat(extra);
      document.querySelector("[data-sa=users-count]").textContent=all.length;
      document.querySelector("[data-sa=active-rentals]").textContent=bk.filter(function(b){return b.status==="active";}).length;
      var thisMonth=tx.filter(function(t){return (t.date||"").indexOf("2026-06")===0;}).reduce(function(a,b){return a+b.amount;},0);
      document.querySelector("[data-sa=month-rev]").textContent=thisMonth.toLocaleString()+" ETB";
      document.querySelector("[data-sa=open-disputes]").textContent=dp.filter(function(d){return d.status==="open";}).length;
      var admins=all.filter(function(u){return (u.role||[]).indexOf("admin")>=0 || (u.role||[]).indexOf("super_admin")>=0;});
      document.querySelector("[data-sa=admin-list]").innerHTML=admins.map(function(a){return "<div class=\"d-flex justify-content-between border-bottom py-2\"><span>"+a.name+" <span class=\"text-muted small\">("+a.email+")</span></span><span class=\"badge bg-"+(a.status==="suspended"?"secondary":"success")+"\">"+(a.status||"active")+"</span></div>";}).join("");
      document.querySelector("[data-sa=activity-feed]").innerHTML=log.slice().reverse().slice(0,6).map(function(l){return "<li class=\"mb-2\"><i class=\"bi bi-dot text-brand\"></i><strong>"+l.actor+"</strong> "+l.action+" <em>"+l.target+"</em> <span class=\"text-muted\">· "+l.date+"</span></li>";}).join("");
    });
  }
  document.addEventListener("DOMContentLoaded", load);
})();
</script>
    </main>
  </div></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../app.js"></script>
</body></html>
